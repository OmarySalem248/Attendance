<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My first map</title>
  <!-- STEP 1: load the three libraries. Vega-Lite does the charting. -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5.30.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0"></script>
</head>
<body>
  <h1>School attendance by state, 2025</h1>

  <!-- STEP 2: an empty box where the map will be drawn. -->
  <div id="map"></div>

  <script>
    // STEP 3: describe the chart. A Vega-Lite chart is just an object with
    // four ideas: data, transform, mark, encoding.
    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 500,
      "height": 400,

      // DATA: the shapes. Each state is one shape with a name in properties.state
      "data": {
        "url": "australia_states.topojson",
        "format": {"type": "topojson", "feature": "states"}
      },

      // PROJECTION: how to flatten the globe. This one keeps areas fair for Australia.
      "projection": {
        "type": "conicEqualArea", "parallels": [-18, -36],
        "rotate": [-134, 0], "center": [0, -27],
        "scale": 680, "translate": [250, 195]
      },

      // TRANSFORM: join the shapes to the numbers by matching state names.
      // After this, every shape also carries its all_level value.
      "transform": [{
        "lookup": "properties.state",
        "from": {"data": {"url": "state_2025.json"}, "key": "state", "fields": ["all_level"]}
      }],

      // MARK: draw each row as a map shape, with white borders.
      "mark": {"type": "geoshape", "stroke": "white"},

      // ENCODING: connect data to what you see. Here: value -> colour.
      "encoding": {
        "color": {
          "field": "all_level", "type": "quantitative",
          "title": "Students attending 90%+ of days (%)",
          "scale": {"scheme": "blues"}
        },
        "tooltip": [
          {"field": "properties.state", "type": "nominal", "title": "State"},
          {"field": "all_level", "type": "quantitative", "title": "Attend 90%+ of days (%)"}
        ]
      }
    };

    // STEP 4: draw it.
    vegaEmbed("#map", spec);
  </script>
</body>
</html>
